<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vui học lớp 1</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--co:#FF6B6B;--ye:#FFD93D;--gr:#6BCB77;--bl:#4D96FF;--pu:#9B59B6;--cr:#FFF6E5;--tx:#2d2a4a}
*{box-sizing:border-box}body{margin:0;font-family:'Nunito','Be Vietnam Pro',sans-serif;background:var(--cr);color:var(--tx);font-size:22px;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Be Vietnam Pro',sans-serif;margin:.3em 0}
.deco{position:fixed;z-index:0;pointer-events:none;opacity:.55;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:28px;box-shadow:0 10px 28px rgba(80,60,120,.12);padding:22px;margin:16px 0}
button{font-family:inherit;font-weight:800;font-size:22px;border:none;border-radius:20px;min-height:64px;min-width:64px;padding:10px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.big{background:var(--co);color:#fff;font-size:28px;padding:14px 40px}
.spk{background:var(--ye);min-width:56px;min-height:56px;padding:6px 10px;font-size:26px;border-radius:50%}
input{font-family:inherit;font-size:28px;font-weight:800;border:4px solid #e3d9f5;border-radius:18px;padding:10px;text-align:center;min-height:64px}
input:focus{outline:none;border-color:var(--bl)}
.num{width:84px}.ok{border-color:var(--gr)!important;background:#eafbec}.bad{border-color:var(--co)!important;background:#ffecec}
.login{max-width:480px;margin:6vh auto;text-align:center}
.login input{width:100%;margin:14px 0}
.msg{min-height:34px;font-weight:800;color:var(--co)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.lc{border-radius:30px;padding:20px;color:#fff;cursor:pointer;position:relative;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.lc h3{font-size:26px}.lc .spk{position:absolute;top:14px;right:14px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:var(--bl);color:#fff}
.prog{flex:1;height:22px;background:#eee;border-radius:12px;overflow:hidden;min-width:120px}.prog div{height:100%;background:linear-gradient(90deg,var(--gr),var(--ye));width:0;transition:width .4s}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.eq{font-size:30px;font-weight:900;background:#f6f1ff;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:8px}
.chip{background:#fff;border:4px solid var(--bl);color:var(--tx);box-shadow:0 4px 0 #c9dcff}
.chip.sel{background:var(--bl);color:#fff}.chip.done{background:var(--gr);border-color:var(--gr);color:#fff}
.chip.wrong{background:var(--co);border-color:var(--co);color:#fff}
.sec{border-left:10px solid var(--pu);padding-left:14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.match>div{display:flex;flex-direction:column;gap:12px}
.pass span{cursor:pointer;border-radius:10px;padding:2px 4px;line-height:1.9}.pass span:hover{background:#fff3c4}.pass span.hl{background:var(--ye)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;padding:14px 28px;border-radius:30px;font-size:26px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:9;display:none}
.pics{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.pics svg{width:46px;height:46px}
.ill svg{width:90px;height:90px}
.narr{display:inline-flex;align-items:center;gap:6px;color:var(--pu);font-size:28px}
.narr i{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:36px;padding:0 10px;background:#eef3ff;border:2px solid var(--bl);border-radius:12px;font-style:normal;font-size:20px;color:var(--bl)}
.celebrate{text-align:center}.celebrate .stars{font-size:70px;animation:fl 1.5s infinite}
footer{text-align:center;font-size:16px;opacity:.6;padding:20px}
.hide{display:none}
@media(max-width:600px){body{font-size:20px}.eq{font-size:24px}.num{width:68px}}

body{background:linear-gradient(180deg,#FFF6E5 0%,#FFE4C4 60%,#FFD3A8 100%);background-attachment:fixed}
.hero{position:relative;border-radius:32px;overflow:hidden;box-shadow:0 16px 40px rgba(80,60,120,.16);margin:4px 0 8px}
.hero img{width:100%;height:auto;display:block}
.hero .spk{position:absolute;top:16px;right:16px;z-index:2}
.lc.vis{padding:0;overflow:hidden;aspect-ratio:16/9;min-height:0;background:#fff;box-shadow:0 12px 28px rgba(80,60,120,.16)}
.lc.vis img{width:100%;height:100%;object-fit:cover;display:block}
.lc.vis .spk{z-index:2}
.badge-ok{position:absolute;left:16px;bottom:16px;background:#fff;color:#2d9a42;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.08)}

.en-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
.en-w{background:#fff;border-radius:24px;padding:18px;cursor:pointer;box-shadow:0 10px 24px rgba(80,60,120,.12);color:#2d2a4a;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.en-w b{font-size:22px}
.en-letter{font-size:72px;font-weight:900;color:#5c6bc0;line-height:1}
.en-words{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:14px 0}
.en-word{background:#fff;border-radius:22px;padding:12px;text-align:center;box-shadow:0 8px 20px rgba(80,60,120,.1);cursor:pointer}
.en-word img{width:132px;height:132px;object-fit:cover;border-radius:18px;display:block;margin:0 auto 8px}
.en-word strong{font-size:24px}
</style></head><body>

let vvoice=null;let evoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();vvoice=vs.find(v=>/^vi/i.test(v.lang))||null;evoice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}

function say(t,rate,onend){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';if(vvoice)u.voice=vvoice;u.rate=rate||0.9;if(onend)u.onend=onend;speechSynthesis.speak(u)}
function sayEn(t,rate,onend){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(evoice)u.voice=evoice;u.rate=rate||0.75;if(onend)u.onend=onend;speechSynthesis.speak(u)}

function englishHome(){speakEn=false;const cols=['#FF6B6B','#6BCB77','#5c6bc0','#FF9F43','#9B59B6','#4D96FF','#2d9a42','#e04848','#7c4dff'];

<p>Ôn tập theo sách Tiếng Anh 1 Global Success, tuần 1 đến tuần 9. Bé nghe, nhắc lại và làm bài nhỏ nhé!</p>
<div class="en-week">`+EN_WEEKS.map((w,i)=>`<div class="en-w" data-ew="${w.week}" style="border-top:10px solid ${cols[i%cols.length]}"><div style="opacity:.8">Tuần ${w.week}</div><b>${w.title}</b><div>${w.letter} ${w.sound}</div></div>`).join('')+`</div>`;

speakEn=true;total=0;done=0;

const sentHtml=w.sentences.map(s=>`<div class="row"><button class="chip" data-say-en="${s.replace(/"/g,'&quot;')}">🔊 ${s}</button></div>`).join('');
const quizHtml=w.quiz.map((q,i)=>{
  total++;

app.innerHTML=`<div class="top"><button class="back" id="bk">⬅ Các tuần</button><div class="prog"><div></div></div></div>

function route(){const h=location.hash.replace(/^#/,'');if(h==='toan'||h==='tv')subject(h);else if(h==='english')englishOpen();else home()}

function lesson(i){const l=L[i];total=0;done=0;const body=l.build();
app.innerHTML=`<div class="top"><button class="back" id="bk">⬅ Về nhà</button><div class="prog"><div></div></div></div><h1 style="color:${l.c}">${l.tag||('Bài '+(i+1))}: ${l.t} ${spk(l.t)}</h1>`+body;scrollTo(0,0);
document.getElementById('bk').onclick=()=>subject(inferMon(l));if(l.after)l.after();wire(i)}
function wire(i){
app.querySelectorAll('input.num').forEach(inp=>{const chk=()=>{if(inp.dataset.d)return;const v=inp.value.trim();if(!v)return;if(v===inp.dataset.ans){inp.classList.remove('bad');inp.classList.add('ok');inp.readOnly=true;inp.dataset.d=1;good();mark()}else{inp.classList.add('bad');bad();setTimeout(()=>{inp.classList.remove('bad');inp.value=''},900)}};
inp.addEventListener('input',()=>{if(inp.value.length>=inp.dataset.ans.length)chk()});inp.addEventListener('keydown',e=>{if(e.key==='Enter')chk()})});
app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const g=b.closest('[data-grp]');if(g.dataset.d)return;if(b.dataset.ok==='1'){b.classList.add('done');g.dataset.d=1;good();mark()}else{b.classList.add('wrong');bad();setTimeout(()=>b.classList.remove('wrong'),900)}});
app.querySelectorAll('[data-m]').forEach(m=>{const P=JSON.parse(m.dataset.pairs);let sel=null;
m.querySelectorAll('[data-ml]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;m.querySelectorAll('[data-ml]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;const k=b.dataset.ml;say(k.startsWith('p:')?k.slice(2):readEq(k))});
m.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;if(!sel){say(b.dataset.mr);return}
if(P[sel.dataset.ml]===b.dataset.mr){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;good();mark()}else{b.classList.add('wrong');bad();setTimeout(()=>b.classList.remove('wrong'),900)}})});
}
