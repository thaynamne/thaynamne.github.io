function mathMenu(){menu('➕ Toán tuần '+W+(W==8?' – Số và phép cộng trong phạm vi 10':' – Phép trừ, cộng trong phạm vi 10'),MT[W].map(function(x){return [x[0],x[1],"mathQ('"+x[2]+"')"]}).concat([['🏅','6. Thử thách 10 câu','challenge()']]));}
function mathQ(t){var q=gen(t),k=q.txt;if(S.wrong[W+t]&&Math.random()<.4){var w=S.wrong[W+t];}cur=q;typed='';tries=0;var tl={};MT[W].forEach(function(x){tl[x[2]]=x[1].slice(3)});
 var inp=q.t=='cmp'?'<div class="words">'+['>','<','='].map(function(s){return '<button class="w" style="min-width:90px;font-size:40px" onclick="typed=\''+s+'\';$(\'#ans\').textContent=typed;checkM()">'+s+'</button>'}).join('')+'</div>':'<div class="pad">'+[1,2,3,4,5,6,7,8,9,0].map(function(n){return '<button onclick="key('+n+')">'+n+'</button>'}).join('')+'<button class="del" onclick="key(-1)">⌫</button></div><div class="center"><button class="btn go" onclick="checkM()">✔ Kiểm tra</button></div>';
 h('<h2>'+(chal?'🏅 Thử thách: câu '+(chal.i+1)+'/10':tl[t])+'</h2>'+qHTML(q)+inp+'<div id="fb" class="fb"></div><div id="nx" class="center"></div>'+(chal?'':'<button class="btn ghost" onclick="mathMenu()">⬅ Bài khác</button>'));}
function key(n){if(!$('#ans'))return;if(n<0)typed=typed.slice(0,-1);else if(typed.length<2)typed+=n;$('#ans').textContent=typed||'?';}
document.addEventListener('keydown',function(e){if(!$('#ans')||!cur||cur.t=='cmp')return;if(/^\d$/.test(e.key))key(+e.key);else if(e.key==='Backspace')key(-1);else if(e.key==='Enter')checkM();});
function checkM(){if(!cur||$('#nx').innerHTML)return;var good=String(typed)===String(cur.ans);tries++;
 if(good){fb(true,'✅ Đúng rồi! '+cur.txt.replace('?',cur.ans)+(cur.t=='cmp'||cur.t=='miss'||cur.t=='seq'?'':' '+cur.ans)+' 🐰👏');delete S.wrong[W+cur.t];if(!chal||tries===1)addStar();if(chal)chal.res.push({q:cur,ok:tries===1});next();}
 else if(tries<2&&!chal){fb(false,'❌ Chưa đúng, bé thử lại nhé! 🐻');typed='';$('#ans').textContent='?';}
 else{fb(false,'❌ Đáp án đúng là <b>'+cur.ans+'</b>. Lần sau bé làm được! 💪');S.wrong[W+cur.t]=1;save();if(chal)chal.res.push({q:cur,ok:false});next();}}
function next(){$('#nx').innerHTML=chal?'<button class="btn" onclick="chalNext()">Câu tiếp ➡</button>':'<button class="btn" onclick="mathQ(\''+cur.t+'\')">Câu khác ➡</button>';}
function challenge(){chal={i:0,res:[]};chalNext(true);}
function chalNext(f){if(!f)chal.i++;if(chal.i>=10)return chalEnd();mathQ(MT[W][chal.i%5][2]);}
function chalEnd(){var n=chal.res.filter(function(r){return r.ok}).length,st=n>=9?3:n>=6?2:n>=3?1:0,bad=chal.res.filter(function(r){return !r.ok});addStar(st);if(n===10)S.badges['m'+W]=1;save();
 h('<h2>🏅 Kết quả – Toán tuần '+W+'</h2><div class="res">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'<p>Bé đúng <b>'+n+'/10</b> câu</p></div>'+(bad.length?'<h3>Xem lại câu sai:</h3><ul class="rev">'+bad.map(function(r){return '<li>'+esc(r.q.txt)+' → <b>'+esc(r.q.ans)+'</b></li>'}).join('')+'</ul>':'<p class="center">Giỏi quá! Không sai câu nào 🎉</p>')+'<button class="btn go" onclick="challenge()">🔄 Chơi lại</button><button class="btn ghost" onclick="mathMenu()">⬅ Bài khác</button>');chal=null;if(n>=6)confetti();}
// ===== TIẾNG VIỆT
var VAN={8:[['an','bàn ghế','🪑'],['ăn','khăn mặt','🧣'],['ân','cái cân','⚖️'],['on','nón lá','👒'],['ôn','con chồn','🦊'],['ơn','thợ sơn','🎨'],['en','hoa sen','🌸'],['ên','cây nến','🕯️'],['in','số chín','9️⃣'],['un','chú cún','🐶'],['am','quả cam','🍊'],['ăm','con tằm','🐛'],['âm','cây nấm','🍄']],
9:[['om','lom khom','🧎'],['ôm','thợ gốm','🏺'],['ơm','bơm xe','🚲'],['em','que kem','🍦'],['êm','đêm trăng','🌙'],['im','chim sẻ','🐦'],['um','cái chum','🫙'],['ai','mái nhà','🏠'],['ay','máy bay','✈️'],['ây','thầy cô','👩‍🏫'],['oi','sỏi màu','🪨'],['ôi','hội chợ','🎡'],['ơi','đồ chơi','🧸']]};
var TU={8:[['con ngan','🦢'],['bàn tay','✋'],['cái khăn','🧣'],['cái cân','⚖️'],['nón lá','👒'],['con chồn','🦊'],['hoa sen','🌸'],['cây nến','🕯️'],['đèn pin','🔦'],['chú cún','🐶'],['quả cam','🍊'],['cây nấm','🍄'],['tắm biển','🏖️'],['con tằm','🐛']],
9:[['con tôm','🦐'],['bữa cơm','🍚'],['que kem','🍦'],['chim sẻ','🐦'],['chùm nho','🍇'],['máy bay','✈️'],['cái cây','🌳'],['con voi','🐘'],['cái chổi','🧹'],['đi bơi','🏊'],['con nai','🦌'],['đám mây','☁️'],['cái váy','👗'],['đồ chơi','🧸']]};
var CAU={8:[['Mẹ ___ cơm cho bé.','nấu',['nón','sen']],['Bé ___ bài thật chăm.','ôn',['ăn','in']],['Đàn ngan bơi trên ___.','hồ',['nến','cân']],['Bé lau mặt bằng ___.','khăn',['cam','nấm']],['Chú cún ___ bé.','vẫy đuôi với',['ăn','sơn']],['Hoa ___ nở trong đầm.','sen',['cún','tằm']]],
9:[['Chú chim ___ trên cành.','hót',['bơi','kem']],['Máy bay ___ trên trời.','bay',['bơi','chơi']],['Bé ăn ___ mát lạnh.','kem',['voi','mây']],['Con ___ có vòi dài.','voi',['nai','tôm']],['Bé và bạn cùng ___.','chơi',['chổi','còi']],['Mẹ dọn ___ cho cả nhà.','bữa cơm',['máy bay','đám mây']]]};
function tvMenu(){menu('📖 Tiếng Việt tuần '+W+' – Vần '+VAN[W].map(function(v){return v[0]}).join(', '),[['🔤','1. Luyện vần','tvVan(0)'],['🗣️','2. Đọc từ','tvTu()'],['🎧','3. Nghe và chọn','tvPick()'],['🧩','4. Tìm vần trong từ','tvGhep()'],['✏️','5. Điền từ vào câu','tvDien()'],['🏅','6. Thử thách 10 câu','tvChal()']]);
 $('#main').insertAdjacentHTML('afterbegin','<div class="road">Lộ trình đọc thành thạo: <b>① Nghe</b> → <b>② Đọc theo</b> → <b>③ Tự đọc</b></div>');}
function steps(k){var s=S.badges['st'+k]||0;return '<div class="steps">'+['🎧 Nghe','🗣️ Đọc theo','⭐ Tự đọc'].map(function(t,i){return '<button class="'+(s>i?'done':'')+'" onclick="step(\''+k+'\','+i+')">'+t+'</button>'}).join('')+'</div>';}
function step(k,i){var s=S.badges['st'+k]||0;if(i>s){toast('Bé làm bước '+(s+1)+' trước nhé!');return;}var v=VAN[W][+k.split('_')[1]];if(i<2)speak(v[0]+'. '+v[1]);if(i>=s){S.badges['st'+k]=i+1;if(i===2){addStar(2);confetti();beep(true);toast('🏅 Bé nhận huy hiệu!');}save();}tvVan(+k.split('_')[1]);}
function hl(w,v){return esc(w).replace(new RegExp('('+v+')'),'<u>$1</u>');}
function tvVan(i){var L=VAN[W],v=L[i],k=W+'_'+i;h('<h2>🔤 Luyện vần ('+(i+1)+'/'+L.length+')</h2><div class="van">'+v[0]+((S.badges['st'+k]||0)>=3?' <span class="bdg">🏅</span>':'')+'</div><div class="ex"><div style="font-size:90px">'+v[2]+'</div><div>'+hl(v[1],v[0])+'</div></div><div class="center"><button class="btn" onclick="speak(\''+v[0]+'. '+v[1]+'\',.6)">🔊 Đánh vần chậm</button><button class="btn" onclick="speak(\''+v[0]+'\')">🔤 Vần</button><button class="btn" onclick="speak(\''+v[1]+'\')">🗣️ Từ</button></div>'+steps(k)+'<p class="hint center">Bước 3: bé tự đọc to rồi bấm ⭐.</p><div class="nav"><button class="btn ghost" '+(i?'':'disabled')+' onclick="tvVan('+(i-1)+')">⬅ Trước</button><button class="btn ghost" onclick="tvVan('+((i+1)%L.length)+')">Sau ➡</button></div><div class="chips">'+L.map(function(x,j){return '<button class="chip'+(j==i?' on':'')+((S.badges['st'+W+'_'+j]||0)>=3?' got':'')+'" onclick="tvVan('+j+')">'+x[0]+'</button>'}).join('')+'</div><button class="btn ghost" onclick="tvMenu()">⬅ Bài khác</button>');}
function tvTu(){h('<h2>🗣️ Đọc từ</h2><p class="hint">Bấm vào từ để nghe.</p><div class="words">'+TU[W].map(function(t){return '<button class="w wi" onclick="speak(\''+t[0]+'\')"><span style="font-size:48px">'+t[1]+'</span><span>'+t[0]+'</span></button>'}).join('')+'</div><button class="btn ghost" onclick="tvMenu()">⬅ Bài khác</button>');}
// câu hỏi TV chung (chọn đáp án)
var tq=null;
function tvGenPick(){var o=shuffle(TU[W]).slice(0,4),a=o[rnd(4)];return {k:'pick',say:a[0],q:'🎧 Nghe và chọn từ đúng',body:'<div class="center"><button class="btn big" onclick="speak(tq.say)">🔊 Nghe lại</button></div>',opts:o.map(function(x){return [x[0],'<span style="font-size:48px">'+x[1]+'</span><span>'+x[0]+'</span>']}),ans:a[0],rev:a[0]};}
function tvGenGhep(){var L=VAN[W],v=L[rnd(L.length)],o=shuffle(L.filter(function(x){return x[0]!==v[0]})).slice(0,3).map(function(x){return x[0]}).concat(v[0]);return {k:'ghep',q:'🧩 Từ này có vần gì?',body:'<div class="ex"><div style="font-size:80px">'+v[2]+'</div><div>'+esc(v[1])+' <button class="btn sm" onclick="speak(\''+v[1]+'\')">🔊</button></div></div>',opts:shuffle(o).map(function(x){return [x,x]}),ans:v[0],rev:v[1]+' → vần '+v[0]};}
function tvGenDien(){var c=CAU[W][rnd(CAU[W].length)];return {k:'dien',q:'✏️ Chọn từ điền vào chỗ trống',body:'<div class="sent">'+esc(c[0]).replace('___','<span class="box wide">?</span>')+'</div>',opts:shuffle([c[1]].concat(c[2])).map(function(x){return [x,x]}),ans:c[1],rev:c[0].replace('___',c[1])};}
var TG={pick:tvGenPick,ghep:tvGenGhep,dien:tvGenDien},tchal=null,ttry=0;
function tvQ(k){tq=TG[k]();ttry=0;h('<h2>'+(tchal?'🏅 Thử thách: câu '+(tchal.i+1)+'/10':tq.q)+'</h2>'+(tchal?'<p class="hint">'+tq.q+'</p>':'')+tq.body+'<div class="words">'+tq.opts.map(function(o,i){return '<button class="w'+(k=='pick'?' wi':'')+'" onclick="tvA(this,'+i+')">'+o[1]+'</button>'}).join('')+'</div><div id="fb" class="fb"></div><div id="nx" class="center"></div>'+(tchal?'':'<button class="btn ghost" onclick="tvMenu()">⬅ Bài khác</button>'));if(k=='pick')setTimeout(function(){speak(tq.say)},300);}
function tvA(b,i){if($('#nx').innerHTML)return;var good=tq.opts[i][0]===tq.ans;ttry++;
 if(good){b.classList.add('done');fb(true,'✅ Đúng rồi: '+esc(tq.rev)+' 🐰👏');if(!tchal||ttry===1)addStar();if(tchal)tchal.res.push({q:tq,ok:ttry===1});$('#nx').innerHTML=tchal?'<button class="btn" onclick="tvChalNext()">Câu tiếp ➡</button>':'<button class="btn" onclick="tvQ(\''+tq.k+'\')">Câu khác ➡</button>';}
 else if(tchal){b.classList.add('shake');fb(false,'❌ Đáp án đúng là <b>'+esc(tq.ans)+'</b> 💪');tchal.res.push({q:tq,ok:false});$('#nx').innerHTML='<button class="btn" onclick="tvChalNext()">Câu tiếp ➡</button>';}
 else{b.classList.add('shake');b.disabled=true;fb(false,'❌ Chưa đúng, bé thử lại nhé! 🐻');}}
function tvPick(){tvQ('pick')}function tvGhep(){tvQ('ghep')}function tvDien(){tvQ('dien')}
function tvChal(){tchal={i:0,res:[]};tvChalNext(true);}
function tvChalNext(f){if(!f)tchal.i++;if(tchal.i>=10)return tvChalEnd();tvQ(['ghep','pick','dien'][tchal.i%3]);}
function tvChalEnd(){var n=tchal.res.filter(function(r){return r.ok}).length,st=n>=9?3:n>=6?2:n>=3?1:0,bad=tchal.res.filter(function(r){return !r.ok});addStar(st);if(n===10)S.badges['t'+W]=1;save();
 h('<h2>🏅 Kết quả – Tiếng Việt tuần '+W+'</h2><div class="res">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'<p>Bé đúng <b>'+n+'/10</b> câu</p></div>'+(bad.length?'<h3>Xem lại câu sai:</h3><ul class="rev">'+bad.map(function(r){return '<li>'+esc(r.q.rev)+'</li>'}).join('')+'</ul>':'<p class="center">Giỏi quá! Không sai câu nào 🎉</p>')+'<button class="btn go" onclick="tvChal()">🔄 Chơi lại</button><button class="btn ghost" onclick="tvMenu()">⬅ Bài khác</button>');tchal=null;if(n>=6)confetti();}
function progress(){var b=S.badges;h('<h2>🏆 Tiến bộ của em</h2><div class="pane"><p>⭐ Tổng số sao: <b>'+S.stars+'</b></p><table><tr><th></th><th>Tuần 8</th><th>Tuần 9</th></tr><tr><td>Toán 10/10</td><td>'+(b.m8?'🏅':'–')+'</td><td>'+(b.m9?'🏅':'–')+'</td></tr><tr><td>Tiếng Việt 10/10</td><td>'+(b.t8?'🏅':'–')+'</td><td>'+(b.t9?'🏅':'–')+'</td></tr></table><p class="hint">Dữ liệu chỉ lưu trên máy này.</p></div><button class="btn ghost" onclick="home()">⬅ Trang chủ</button>');}
