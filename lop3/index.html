<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vui học lớp 3 — Thầy Nam Nè</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--cr:#FFF6E5;--tx:#2d2a4a;--bl:#4D96FF}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito','Be Vietnam Pro',sans-serif;background:var(--cr);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{background:#fff;border-radius:32px;box-shadow:0 10px 28px rgba(80,60,120,.12);padding:36px 28px;max-width:520px}
h1{font-family:'Be Vietnam Pro',sans-serif;font-size:36px;margin:0 0 10px}
p{font-size:22px;font-weight:700;margin:0 0 24px;opacity:.85}
a{display:inline-block;text-decoration:none;background:var(--bl);color:#fff;font-weight:900;font-size:22px;padding:14px 28px;border-radius:20px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
a:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="card">
  <h1>Lớp 3 sắp có</h1>
  <p>Bài học lớp 3 đang được chuẩn bị. Em quay lại chọn lớp khác nhé!</p>
  <a href="../">Về trang chọn lớp</a>
</div>
</body>
</html>
