<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF6E5"><title>Sản phẩm STEM của tớ — Thầy Nam Nè!</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="reader"><a class="back" href="./">← Tất cả truyện tranh</a><h1>Tập mới – Sản phẩm STEM của tớ</h1><nav class="controls" aria-label="Chuyển trang"><button id="prev" type="button">← Trang trước</button><span id="count" aria-live="polite"></span><button id="next" type="button">Trang sau →</button></nav><div class="frame"><img class="page" id="page" src="stem/p00.jpg" alt="Bìa Sản phẩm STEM của tớ"></div><p class="hint">Bấm nút, dùng phím ← → hoặc vuốt ngang để lật trang.</p><noscript>Em hãy bật JavaScript để lật trang truyện nhé.</noscript></main><footer>Thầy Nam Nè! · Đọc truyện miễn phí</footer><script>const slug="stem",total=20,title="Sản phẩm STEM của tớ";let current=0;const image=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function show(p){current=Math.max(0,Math.min(total-1,p));image.src=slug+'/p'+String(current).padStart(2,'0')+'.jpg';image.alt=title+' — trang '+(current+1)+' / '+total;count.textContent='Trang '+(current+1)+' / '+total;prev.disabled=current===0;next.disabled=current===total-1;if(current+1<total){const preload=new Image();preload.src=slug+'/p'+String(current+1).padStart(2,'0')+'.jpg';}}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(current+(e.key==='ArrowRight'?1:-1));}});let x=0,y=0;image.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY;},{passive:true});image.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(current+(dx<0?1:-1));},{passive:true});show(0);</script></body></html>
